<!DOCTYPE html>
<html>

<head>
    <title>grid practise</title>

    <style>
        .div1 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 10px;
        }
    </style>

</head>

<body>
    <div class="div1">
        <div style="background-color: lightblue;">
            div1
        </div>
        <div style="background-color: pink;">div2</div>
    </div>

</body>

</html>
