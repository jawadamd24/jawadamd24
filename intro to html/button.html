<style>
    .subscribe-button {
        background-color: #f03;
        color: white;
        border: none;
        padding-bottom: 10px;
        padding-top: 10px;
        padding-left: 16px;
        padding-right: 16px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 2px;
        transition: opacity 0.15s;
    }
    .subscribe-button:hover{
        opacity: 0.8;
    }
    .subscribe-button:active{
        opacity: 0.5;
    }
    .join-button {
        background-color: white;
        border-color: rgb(83, 123, 255);
        color: rgb(81, 81, 234);
        padding-bottom: 9px;
        padding-top: 9px;
        padding-left: 16px;
        padding-right: 16px;
        border-width: 1px;
        border-radius: 2px;
        border-width: 1px;
        border-style: solid;
        cursor: pointer;
        margin-left: 8px;
        transition: opacity 0.15s, color 0.15s;
    }
    .join-button:hover{
        background-color: rgb(0, 81, 255);
        color: white;
    }
    .join-button:active {
        opacity: 0.6;
    }
    .tweet-button {
        background-color: rgb(0, 174, 255);
        color: white;
        border: none;
        border-radius: 18px;
        padding-bottom: 9px;
        padding-top: 9px;
        padding-left: 16px;
        padding-right: 16px;
        margin-left: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: box-shadow 0.15s;
    }
    .tweet-button:hover{
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
    }
    .tweet-button:active {
        opacity: 0.5;
    }
</style>
<button class="subscribe-button">SUBSCRIBE</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">Tweet</button>
